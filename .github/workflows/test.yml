# Runs install-tools.sh on fresh machines, answering yes to everything (BOOTSTRAP_YES=1), and
# checks what ended up installed. The interactive questions and the GitHub sign-in are skipped.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install-tools.sh

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:24.04",        az: yes, python: ok }
          - { image: "debian:12",           az: yes, python: ok }
          - { image: "fedora:41",           az: no,  python: ok }
          - { image: "archlinux:latest",    az: no,  python: ok }
          - { image: "opensuse/tumbleweed", az: no,  python: ok }
          - { image: "rockylinux:9",        az: yes, python: old }   # RHEL 9 keeps python3 at 3.9
    steps:
      - uses: actions/checkout@v4
      - name: install-tools.sh in ${{ matrix.image }}
        run: |
          docker run --rm -e BOOTSTRAP_YES=1 -e BOOTSTRAP_AZ=1 -e SHELL=/bin/bash \
            -e EXPECT_AZ=${{ matrix.az }} -e EXPECT_PYTHON=${{ matrix.python }} \
            -v "$PWD:/b:ro" "${{ matrix.image }}" sh -c '
              set -e
              # curl is how users fetch the script, so it is there on a real machine.
              if command -v apt-get >/dev/null; then apt-get update -qq >/dev/null && apt-get install -y -qq curl >/dev/null; fi
              if command -v zypper >/dev/null; then zypper -n -q install curl >/dev/null; fi
              cat /b/install-tools.sh | bash
              export PATH="$HOME/.local/bin:$PATH"
              git --version && gh --version | head -1 && claude --version
              if [ "$EXPECT_AZ" = yes ]; then az version -o tsv | head -1; else ! command -v az; fi
              if [ "$EXPECT_PYTHON" = ok ]; then python3 -c "import sys; assert sys.version_info >= (3, 10)"; fi
              echo PASS'

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: remove what the image already has, so the script installs it
        run: |
          brew uninstall --ignore-dependencies gh azure-cli terminal-notifier 2>/dev/null || true
          ! command -v gh
      - name: install-tools.sh
        env: { BOOTSTRAP_YES: "1", BOOTSTRAP_AZ: "1" }
        run: cat install-tools.sh | bash
      - name: check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git --version && gh --version | head -1 && az version -o tsv | head -1
          command -v terminal-notifier && claude --version
          python3 -c "import sys; assert sys.version_info >= (3, 10)"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: stops with a clear message on Windows (Git Bash)
        shell: bash
        run: |
          if out=$(bash install-tools.sh 2>&1); then echo "$out"; echo "expected it to stop"; exit 1; fi
          echo "$out"
          grep -q "only Linux and macOS are supported" <<<"$out"
